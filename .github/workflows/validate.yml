name: Validate skill package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-10-30
        with:
          persist-credentials: false
      - name: Validate repository
        run: python3 scripts/validate.py
      - name: Run isolated unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build distribution archives
        run: python3 scripts/package.py --out dist
